version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: siphon
    main: ./cmd/siphon
    binary: siphon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jlrickert/siphon/pkg/cli.Version={{.Version}}

archives:
  - id: siphon
    builds:
      - siphon
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

brews:
  - ids: [siphon]
    name: siphon
    repository:
      owner: jlrickert
      name: homebrew-formulae
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jlrickert/siphon"
    description: "Database backup, restore, transfer, and management tool"
    license: "Apache-2.0"
    install: |
      bin.install "siphon"
      generate_completions_from_executable(bin/"siphon", "completion")
    test: |
      system "#{bin}/siphon", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore\\(release\\)"
      - "^chore: release"
      - "^Merge"

release:
  footer: |
    ---
    Released with [GoReleaser](https://goreleaser.com).
